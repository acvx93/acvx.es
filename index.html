<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>acvx.es</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0c10;
    --fg: #f5f5f5;
    --accent: #6ee7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  main { max-width: 480px; }
  h1 {
    font-size: clamp(2rem, 8vw, 3.5rem);
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0;
    opacity: 0.7;
    font-size: 1.1rem;
  }
  .dot {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>acvx<span class="dot">.</span>es</h1>
  <p>Próximamente.</p>
</main>
</body>
</html>
